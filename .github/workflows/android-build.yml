name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # android/app/build.gradle applies the Google Services plugin ONLY when this file
    # exists. Without it no FirebaseApp is initialized on Android, so native push is
    # unavailable and the JS side disables it (see vite.config.ts / nativePush.ts).
    # This is a warning, not a failure — the APK still builds and runs.
    - name: Check native Firebase config
      run: |
        if [ -f android/app/google-services.json ]; then
          echo "### ✅ google-services.json present — Android push enabled" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### ⚠️ google-services.json MISSING — Android push disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This APK will skip native push notifications. To enable them: Firebase Console →" >> "$GITHUB_STEP_SUMMARY"
          echo "Project settings → Your apps → Android app (package \`com.example.app\`) → download" >> "$GITHUB_STEP_SUMMARY"
          echo "google-services.json → save to \`android/app/google-services.json\` → rebuild." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Android push disabled::android/app/google-services.json is missing, so native push is disabled in this APK."
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: |
        npm ci --include=optional
        npm rebuild @tailwindcss/oxide

    - name: Build React Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # Prints the signing certificate of the APK that was just built.
    # The SHA-256 must stay identical on every run — if it ever changes, an APK
    # installed from a previous run can no longer be updated in place and Android
    # reports "App not installed". Check this line first when that happens.
    - name: Verify APK signing certificate
      run: |
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
        echo "### APK size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
          | grep -E "SHA-256|Signer #1 certificate DN" >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
